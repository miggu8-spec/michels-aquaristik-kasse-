.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block} .info{padding:9px} .name{font-weight:800;min-height:39px;font-size:14px} .price{font-size:18px;font-weight:800;margin:5px 0}
.stock{font-size:12px;color:#607066} .add{width:100%;border:0;border-radius:9px;padding:10px;margin-top:8px;background:#287447;color:#fff;font-weight:800} .add:disabled{background:#999}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
.cartbtn{width:100%;border:0;border-radius:12px;background:#123b2b;color:#fff;padding:14px;font-size:17px;font-weight:800}
.sheet{display:none;position:fixed;inset:0;background:#0007;z-index:30} .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;max-height:85vh;overflow:auto;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.row{padding:10px 0;border-bottom:1px solid #ddd} .qty button{width:34px;height:34px;margin:5px;border:0;border-radius:8px} .total{font-size:26px;font-weight:900;margin:14px 0}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:7px} .pay button,.close,.reset,.printbtn,.journalbtn,.backbtn{border:0;border-radius:10px;padding:12px;font-weight:800} .pay button{background:#287447;color:#fff} .close{width:100%;margin-top:10px}.printbtn{width:100%;margin-top:10px;background:#123b2b;color:#fff;display:none} .receipt{white-space:pre-wrap;font-family:monospace;background:#f6f6f6;padding:12px;margin-top:12px}.journalbtn{width:100%;margin-top:10px;background:#dce9df;color:#123b2b}.journal{display:none;position:fixed;inset:0;background:#f2f5f2;z-index:40;overflow:auto;padding-bottom:30px}.journalhead{position:sticky;top:0;background:#123b2b;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}.backbtn{background:#fff;color:#123b2b;padding:8px 10px}.journalbody{max-width:900px;margin:auto;padding:14px}.sale{background:#fff;border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 1px 7px #0002}.saleTop{display:flex;justify-content:space-between;gap:10px}.saleItems{font-size:13px;color:#506057;margin:8px 0}.sale button{border:0;border-radius:9px;padding:9px 11px;background:#287447;color:#fff;font-weight:800}.empty{text-align:center;padding:35px;color:#607066}.summary{background:#fff;border-radius:13px;padding:14px;margin-bottom:14px;box-shadow:0 1px 7px #0002}.summary h3{margin:0 0 12px}.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.sumcard{background:#eef5ef;border-radius:10px;padding:10px}.sumcard small{display:block;color:#607066}.sumcard b{font-size:18px}.sumtotal{grid-column:1/-1;background:#dce9df}.sumdate{font-size:13px;color:#607066;margin-bottom:10px}.datefilter{display:flex;gap:8px;align-items:end;margin:0 0 12px;flex-wrap:wrap}.datefilter label{font-size:12px;color:#607066}.datefilter input{display:block;margin-top:4px;padding:9px;border:1px solid #cbd8cf;border-radius:9px;background:#fff}.datefilter button{border:0;border-radius:9px;padding:10px 12px;background:#dce9df;color:#123b2b;font-weight:800}.monthsummary{margin-top:10px;padding-top:10px;border-top:1px solid #dbe5dd}.managebtn{width:100%;margin-top:10px;border:0;border-radius:10px;padding:12px;background:#dce9df;color:#123b2b;font-weight:800}.inventory{display:none;position:fixed;inset:0;background:#f2f5f2;z-index:45;overflow:auto;padding-bottom:30px}.invbody{max-width:900px;margin:auto;padding:14px}.invcard{background:#fff;border-radius:13px;padding:13px;margin-bottom:10px;box-shadow:0 1px 7px #0002}.invtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.invlow{color:#a43b22;font-weight:800}.invactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.invactions button{border:0;border-radius:9px;padding:9px 11px;background:#287447;color:#fff;font-weight:800}.invactions .edit{background:#dce9df;color:#123b2b}.invform{background:#fff;border-radius:13px;padding:14px;margin-bottom:14px;box-shadow:0 1px 7px #0002}.invform input,.invform select{width:100%;padding:10px;border:1px solid #cbd8cf;border-radius:9px;margin:5px 0 10px}.invform button{border:0;border-radius:9px;padding:10px 12px;background:#287447;color:#fff;font-weight:800}.warn{background:#fff2e8;border-radius:9px;padding:8px;margin-top:8px;font-size:13px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr);max-width:1000px;margin:auto}}
.deletebtn{background:#f6dddd!important;color:#8b1e1e!important}.deletebtn:active{transform:scale(.98)}
.catmanage{background:#eef5ef;border-radius:11px;padding:12px;margin:0 0 14px}.catrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.catpill{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #d5dfd7;border-radius:18px;padding:6px 8px 6px 10px;font-size:13px}.catpill button{padding:3px 7px!important;background:#f6dddd!important;color:#8b1e1e!important}.pkgbox{background:#f7faf7;border:1px solid #dce9df;border-radius:10px;padding:10px;margin:3px 0 10px}.pkgbox b{display:block;margin-bottom:6px}.pkghint{font-size:12px;color:#607066;margin-top:-4px}.package{font-size:12px;color:#287447;font-weight:700;margin-top:3px}.photoPick{display:block;width:100%;border:2px dashed #9bb6a2;border-radius:11px;padding:12px;margin:5px 0 10px;background:#eef5ef;color:#123b2b;text-align:center;font-weight:800;cursor:pointer}.photoPick input{display:none}.photoPreview{display:none;margin:0 0 10px}.photoPreview img{width:120px;height:120px;object-fit:cover;border-radius:12px;display:block;border:1px solid #d5dfd7}.photoHint{font-size:12px;color:#607066;margin:-4px 0 10px}.backupbox{background:#fff;border-radius:13px;padding:14px;margin-bottom:14px;box-shadow:0 1px 7px #0002}.backupactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.backupactions button,.backupactions label{border:0;border-radius:9px;padding:11px;background:#123b2b;color:#fff;font-weight:800;text-align:center;cursor:pointer}.backupactions input{display:none}.backupnote{font-size:12px;color:#607066;margin-top:8px}
</style></head><body>
<header><b>🦐 Michels Aquaristik – Kasse</b></header><div class=tabs id=tabs></div><div class=grid id=grid></div>
<div class=bottom><button type="button" class=cartbtn onclick="openCart()">🛒 Warenkorb <span id=count>0</span> Artikel · <span id=bt>CHF 0.00</span></button></div>
<div class=sheet id=sheet onclick="if(event.target===this)closeCart()"><div class=panel><h2>Warenkorb</h2><div id=cart></div><div class=total id=total></div>
<div class=pay><button type="button" onclick="checkout('Bar')">Bar</button><button type="button" onclick="checkout('TWINT')">TWINT</button><button type="button" onclick="checkout('Karte')">Karte</button></div>
<button type="button" class=close onclick=closeCart()>Weiter einkaufen</button><button type="button" class=journalbtn onclick=openJournal()>📒 Kassenjournal</button><button type="button" class=managebtn onclick=openInventory()>📦 Lagerverwaltung</button><button type="button" class=printbtn id=printbtn onclick=printReceipt()>🖨️ Direkt auf Epson drucken</button><button type="button" class=journalbtn onclick=printerSettings()>⚙️ Epson Drucker-Einstellungen</button><button type="button" class=reset onclick=resetDemo()>Test zurücksetzen</button><div id=receipt></div></div></div>
<div class=journal id=journal><div class=journalhead><button type=button class=backbtn onclick=closeJournal()>← Zurück</button><b>📒 Kassenjournal</b></div><div class=journalbody id=journalbody></div></div><div class=inventory id=inventory><div class=journalhead><button type=button class=backbtn onclick=closeInventory()>← Zurück</button><b>📦 Lagerverwaltung</b></div><div class=invbody id=invbody></div></div>
<script>
const tabsEl=document.getElementById('tabs');
const gridEl=document.getElementById('grid');
const countEl=document.getElementById('count');
const bottomTotalEl=document.getElementById('bt');
const sheetEl=document.getElementById('sheet');
const cartEl=document.getElementById('cart');
const totalEl=document.getElementById('total');
const receiptEl=document.getElementById('receipt');
const printBtn=document.getElementById('printbtn');
const journalEl=document.getElementById('journal');
const journalBodyEl=document.getElementById('journalbody');
const inventoryEl=document.getElementById('inventory');
const invBodyEl=document.getElementById('invbody');
let lastReceipt='';
const initial=[{"id": 1, "name": "Cardamine lyrata", "price": 5, "stock": 4, "category": "Pflanzen", "image": "images/p1.jpg"}, {"id": 2, "name": "Limnophila sessiliflora", "price": 5, "stock": 4, "category": "Pflanzen", "image": "images/p2.jpg"}, {"id": 3, "name": "Cryptocoryne spiralis 'Red'", "price": 5, "stock": 3, "category": "Pflanzen", "image": "images/p3.jpg"}, {"id": 4, "name": "Pogostemon", "price": 5, "stock": 1, "category": "Pflanzen", "image": "images/p4.jpg"}, {"id": 5, "name": "Hygrophila corymbosa 'Stricta'", "price": 5, "stock": 3, "category": "Pflanzen", "image": "images/p5.jpg"}, {"id": 6, "name": "Anubias gracilis", "price": 6, "stock": 0, "category": "Pflanzen", "image": "images/p6.jpg"}, {"id": 7, "name": "Lobelia cardinalis", "price": 6, "stock": 3, "category": "Pflanzen", "image": "images/p7.jpg"}, {"id": 8, "name": "Bacopa australis", "price": 5, "stock": 6, "category": "Pflanzen", "image": "images/p8.jpg"}, {"id": 9, "name": "Cryptocoryne beckettii 'Petchii'", "price": 5, "stock": 4, "category": "Pflanzen", "image": "images/p9.jpg"}, {"id": 10, "name": "Alternanthera reineckii 'Rosanervig'", "price": 6, "stock": 6, "category": "Pflanzen", "image": "images/p10.jpg"}, {"id": 11, "name": "Tropica CO₂ System Nano", "price": 75, "stock": 2, "category": "Zubehör / CO₂", "image": "images/p11.jpg"}, {"id": 12, "name": "Red Fire Garnelen", "price": 2, "stock": null, "category": "Garnelen", "image": "images/p12.jpg"}];
let products=JSON.parse(localStorage.getItem('ma_mobile_products')||JSON.stringify(initial)), cart={}, cat='Alle';
let savedCategories=JSON.parse(localStorage.getItem('ma_mobile_categories')||'null');
let categories=Array.isArray(savedCategories)?savedCategories:[];
function syncCategories(){products.forEach(p=>{if(p.category&&!categories.includes(p.category))categories.push(p.category)});categories=categories.filter(Boolean);localStorage.setItem('ma_mobile_categories',JSON.stringify(categories))}
syncCategories();
const money=n=>'CHF '+n.toFixed(2);
function render(){
 syncCategories(); let cats=['Alle',...categories]; tabsEl.innerHTML=cats.map(c=>`<button type="button" class="catbtn${c===cat?' active':''}" data-cat="${c.replace(/&/g,'&amp;').replace(/\"/g,'&quot;')}">${c}</button>`).join(''); tabsEl.querySelectorAll('.catbtn').forEach(btn=>btn.addEventListener('click',()=>{cat=btn.dataset.cat;render();}));
 gridEl.innerHTML=products.filter(p=>cat==='Alle'||p.category===cat).map(p=>`<div class=card><img src="${p.image}"><div class=info><div class=name>${p.name}</div><div class=price>${money(p.price)} / Stk.</div>${p.packageQty>1&&p.packagePrice>=0?`<div class=package>${p.packageQty} Stk. = ${money(p.packagePrice)}</div>`:''}<div class=stock>${p.stock===null?'Bestand variabel':'Lager: '+p.stock+' Stk.'}</div><button type="button" class=add ${p.stock===0?'disabled':''} onclick="add(${p.id})">${p.stock===0?'Ausverkauft':'Hinzufügen'}</button></div></div>`).join('');
 updateCart();
}
function add(id){let p=products.find(x=>x.id===id),q=cart[id]||0;if(p.stock!==null&&q>=p.stock)return;cart[id]=q+1;updateCart()}
function change(id,d){let p=products.find(x=>x.id==id),q=(cart[id]||0)+d;if(q<=0)delete cart[id];else if(p.stock===null||q<=p.stock)cart[id]=q;updateCart()}
function qtyTotal(p,q){let pq=Math.floor(Number(p.packageQty)||0),pp=Number(p.packagePrice);if(pq>1&&Number.isFinite(pp)&&pp>=0){let packs=Math.floor(q/pq),rest=q%pq;return packs*pp+rest*p.price}return q*p.price}
function priceNote(p,q){let pq=Math.floor(Number(p.packageQty)||0),pp=Number(p.packagePrice);if(pq>1&&Number.isFinite(pp)&&pp>=0&&q>=pq){let packs=Math.floor(q/pq),rest=q%pq;return `${packs} Paket${packs!==1?'e':''} à ${money(pp)}${rest?' + '+rest+' × '+money(p.price):''}`}return `${q} × ${money(p.price)}`}
function updateCart(){let ids=Object.keys(cart),sum=ids.reduce((s,id)=>{let p=products.find(x=>x.id==id);return s+qtyTotal(p,cart[id])},0),cnt=ids.reduce((s,id)=>s+cart[id],0);countEl.textContent=cnt;bottomTotalEl.textContent=money(sum);totalEl.textContent=money(sum);cartEl.innerHTML=ids.length?ids.map(id=>{let p=products.find(x=>x.id==id),q=cart[id],lineTotal=qtyTotal(p,q);return `<div class=row><b>${p.name}</b><br>${priceNote(p,q)} = ${money(lineTotal)}<div class=qty><button type="button" onclick="change(${id},-1)">−</button><button type="button" onclick="change(${id},1)">+</button></div></div>`}).join(''):'Warenkorb ist leer.'}
function openCart(){sheetEl.style.display='block';updateCart()} function closeCart(){sheetEl.style.display='none'}
function checkout(method){
 let ids=Object.keys(cart);if(!ids.length)return alert('Warenkorb ist leer.');
 let nr=+(localStorage.getItem('ma_mobile_receipt')||0)+1;
 let now=new Date(), sum=0, lines=[], items=[];
 ids.forEach(id=>{let p=products.find(x=>x.id==id),q=cart[id],lineTotal=qtyTotal(p,q);sum+=lineTotal;lines.push(`${q} x ${p.name}  ${money(lineTotal)}`);items.push({id:p.id,name:p.name,qty:q,price:p.price,packageQty:p.packageQty||null,packagePrice:p.packagePrice??null,total:lineTotal});if(p.stock!==null)p.stock-=q});
 let sale={receiptNo:nr,date:now.toISOString(),payment:method,total:sum,items};
 let sales=JSON.parse(localStorage.getItem('ma_mobile_sales')||'[]');sales.push(sale);
 localStorage.setItem('ma_mobile_sales',JSON.stringify(sales));localStorage.setItem('ma_mobile_receipt',nr);localStorage.setItem('ma_mobile_products',JSON.stringify(products));
 let dateText=now.toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'});
 lastReceipt=`MICHELS AQUARISTIK BLEUER\nBeleg ${String(nr).padStart(6,'0')}\n${dateText}\n------------------------\n${lines.join('\n')}\n------------------------\nTOTAL ${money(sum)}\nZahlung: ${method}\n\nVielen Dank!`;
 receiptEl.innerHTML=`<div class=receipt>${lastReceipt}</div>`;printBtn.style.display='block';cart={};render();
}

function receiptText(sale){let d=new Date(sale.date).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'}),lines=sale.items.map(i=>`${i.qty} x ${i.name}  ${money(i.total)}`);return `MICHELS AQUARISTIK BLEUER\nBeleg ${String(sale.receiptNo).padStart(6,'0')}\n${d}\n------------------------\n${lines.join('\n')}\n------------------------\nTOTAL ${money(sale.total)}\nZahlung: ${sale.payment}\n\nVielen Dank!`}
function openJournal(){closeCart();journalEl.style.display='block';renderJournal()}
function closeJournal(){journalEl.style.display='none'}
function localDateKey(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function renderJournal(selectedDate){
 let all=JSON.parse(localStorage.getItem('ma_mobile_sales')||'[]');
 let now=new Date(), defaultKey=localDateKey(now), key=selectedDate||defaultKey;
 let parts=key.split('-').map(Number), chosen=new Date(parts[0],parts[1]-1,parts[2]);
 if(isNaN(chosen.getTime())){chosen=now;key=defaultKey}
 let daySales=[], bar=0, twint=0, card=0, total=0, monthSales=[], mbar=0, mtwint=0, mcard=0, mtotal=0;
 for(let i=0;i<all.length;i++){
  let sale=all[i], d=new Date(sale.date), amount=Number(sale.total)||0;
  if(d.getFullYear()===chosen.getFullYear() && d.getMonth()===chosen.getMonth()){
   monthSales.push(sale);mtotal+=amount;
   if(sale.payment==='Bar')mbar+=amount;if(sale.payment==='TWINT')mtwint+=amount;if(sale.payment==='Karte')mcard+=amount;
  }
  if(localDateKey(d)===key){daySales.push(sale);total+=amount;if(sale.payment==='Bar')bar+=amount;if(sale.payment==='TWINT')twint+=amount;if(sale.payment==='Karte')card+=amount}
 }
 let dateText=chosen.toLocaleDateString('de-CH'), monthText=chosen.toLocaleDateString('de-CH',{month:'long',year:'numeric'});
 let summary='<div class=summary><h3>📊 Tagesabschluss</h3><div class=datefilter><label>Datum<input id=journalDate type=date value="'+key+'"></label><button type=button onclick="renderJournal(document.getElementById(\'journalDate\').value)">Anzeigen</button></div><div class=sumdate>'+dateText+'</div><div class=sumgrid>'+ 
 '<div class=sumcard><small>Verkäufe</small><b>'+daySales.length+'</b></div>'+ 
 '<div class=sumcard><small>Bar</small><b>'+money(bar)+'</b></div>'+ 
 '<div class=sumcard><small>TWINT</small><b>'+money(twint)+'</b></div>'+ 
 '<div class=sumcard><small>Karte</small><b>'+money(card)+'</b></div>'+ 
 '<div class="sumcard sumtotal"><small>Gesamtumsatz</small><b>'+money(total)+'</b></div></div>'+ 
 '<div class=monthsummary><h3>📅 Monatsübersicht</h3><div class=sumdate>'+monthText+'</div><div class=sumgrid>'+ 
 '<div class=sumcard><small>Verkäufe</small><b>'+monthSales.length+'</b></div>'+ 
 '<div class=sumcard><small>Bar</small><b>'+money(mbar)+'</b></div>'+ 
 '<div class=sumcard><small>TWINT</small><b>'+money(mtwint)+'</b></div>'+ 
 '<div class=sumcard><small>Karte</small><b>'+money(mcard)+'</b></div>'+ 
 '<div class="sumcard sumtotal"><small>Monatsumsatz</small><b>'+money(mtotal)+'</b></div></div></div></div>';
 let sales=all.slice().reverse();
 let list=sales.length?sales.map((s,i)=>`<div class=sale><div class=saleTop><div><b>Beleg ${String(s.receiptNo).padStart(6,'0')}</b><br><small>${new Date(s.date).toLocaleString('de-CH',{dateStyle:'short',timeStyle:'short'})} · ${s.payment}</small></div><b>${money(s.total)}</b></div><div class=saleItems>${s.items.map(x=>`${x.qty} × ${x.name}`).join('<br>')}</div><button type=button onclick="reprint(${s.receiptNo})">🖨️ Beleg anzeigen / drucken</button></div>`).join(''):'<div class=empty>Noch keine Verkäufe gespeichert.</div>';
 journalBodyEl.innerHTML=summary+list;
}
function reprint(nr){let sales=JSON.parse(localStorage.getItem('ma_mobile_sales')||'[]'),sale=sales.find(s=>s.receiptNo===nr);if(!sale)return;lastReceipt=receiptText(sale);let w=window.open('','_blank','width=420,height=650');w.document.write(`<html><head><title>Beleg ${String(nr).padStart(6,'0')}</title><style>@page{size:80mm auto;margin:3mm}html,body{width:74mm;margin:0;padding:0}body{font-family:monospace;white-space:pre-wrap;font-size:11pt;line-height:1.28;overflow-wrap:anywhere}.p{font-family:sans-serif;margin-top:20px}button{padding:10px 14px}@media print{.p{display:none}}</style></head><body>${lastReceipt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}<div class=p><button onclick="window.print()">Drucken</button></div></body></html>`);w.document.close()}


function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function openInventory(){closeCart();inventoryEl.style.display='block';renderInventory()}
function closeInventory(){inventoryEl.style.display='none';render()}
function editProduct(id){
 renderInventory(id);
 inventoryEl.scrollTo({top:0,behavior:'smooth'});
 setTimeout(()=>{const el=document.getElementById('invName');if(el){el.focus();el.select()}},250);
}
function renderInventory(editId){
 let editing=editId?products.find(p=>Number(p.id)===Number(editId)):null;
 let currentImage=editing?.image||'';
 let catOptions=categories.map(c=>`<option value="${esc(c)}" ${c===(editing?.category||'Pflanzen')?'selected':''}>${esc(c)}</option>`).join('');
 let catManager=`<div class=catmanage><b>🏷️ Eigene Kategorien</b><div style="display:flex;gap:7px;margin-top:8px"><input id=newCat style="margin:0" placeholder="Neue Kategorie"><button type=button onclick="addCategory()">+ Hinzufügen</button></div><div class=catrow>${categories.map(c=>`<span class=catpill>${esc(c)} <button type=button onclick="deleteCategory('${encodeURIComponent(c)}')">×</button></span>`).join('')}</div></div>`;
 let backup=`<div class=backupbox><b>💾 Datensicherung</b><div class=backupnote>Speichert Produkte, Fotos, Lagerbestand, Kategorien, Verkäufe und Belegnummer in einer Backup-Datei.</div><div class=backupactions><button type=button onclick=exportBackup()>⬇️ Backup erstellen</button><label>📥 Backup wiederherstellen<input type=file accept="application/json,.json" onchange=importBackup(this)></label></div></div>`;
 let form=backup+`<div class=invform><h3>${editing?'Produkt bearbeiten':'Neues Produkt'}</h3>${catManager}<input id=invName placeholder="Produktname" value="${esc(editing?.name||'')}"><input id=invPrice type=number min=0 step=0.05 placeholder="Einzelpreis CHF" value="${editing?.price??''}"><div class=pkgbox><b>📦 Paketpreis (optional)</b><input id=invPackageQty type=number min=2 step=1 placeholder="Anzahl im Paket, z. B. 10" value="${editing?.packageQty??''}"><input id=invPackagePrice type=number min=0 step=0.05 placeholder="Paketpreis CHF, z. B. 20" value="${editing?.packagePrice??''}"><div class=pkghint>Beispiel: Einzel CHF 2.–, 10 Stück CHF 20.–. Bei 15 Stück rechnet die Kasse 1 Paket + 5 Einzelstücke.</div></div><input id=invStock type=number min=0 step=1 placeholder="Lagerbestand (leer = variabel)" value="${editing?.stock??''}"><select id=invCat>${catOptions}</select><input id=invImage type=hidden value="${esc(currentImage)}"><label class=photoPick>📷 Foto vom Handy auswählen<input id=invPhoto type=file accept="image/*" onchange="chooseProductPhoto(this)"></label><div class=photoHint>Foto aus der Fotomediathek auswählen. Es wird für die Kasse verkleinert gespeichert.</div><div id=invPhotoPreview class=photoPreview style="display:${currentImage?'block':'none'}">${currentImage?`<img src="${esc(currentImage)}" alt="Produktfoto">`:''}</div><input id=invMin type=number min=0 step=1 placeholder="Mindestbestand (Standard 2)" value="${editing?.minStock??2}"><button type=button onclick="saveProduct(${editing?.id||'null'})">${editing?'Änderungen speichern':'Produkt anlegen'}</button>${editing?` <button type=button class=edit onclick="renderInventory()">Abbrechen</button>`:''}</div>`;
 let list=products.map(p=>{let low=p.stock!==null&&p.stock<=(p.minStock??2);return `<div class=invcard><div class=invtop><div><b>${esc(p.name)}</b><br><small>${esc(p.category)} · ${money(p.price)}</small></div><b class="${low?'invlow':''}">${p.stock===null?'variabel':p.stock+' Stk.'}</b></div>${low?'<div class=warn>⚠️ Mindestbestand erreicht oder unterschritten</div>':''}<div class=invactions>${p.stock!==null?`<button type=button onclick="stockChange(${p.id},1)">+1 Wareneingang</button><button type=button onclick="stockChange(${p.id},5)">+5</button>`:''}<button type=button class=edit onclick="editProduct(${p.id})">✏️ Bearbeiten</button><button type=button class=deletebtn onclick="deleteProduct(${p.id})">🗑️ Löschen</button></div></div>`}).join('');
 invBodyEl.innerHTML=form+list;
}
function chooseProductPhoto(input){
 const file=input.files&&input.files[0];if(!file)return;
 if(!file.type.startsWith('image/'))return alert('Bitte eine Bilddatei auswählen.');
 const reader=new FileReader();
 reader.onload=()=>{const img=new Image();img.onload=()=>{let max=900,w=img.width,h=img.height;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);let data=canvas.toDataURL('image/jpeg',0.78);document.getElementById('invImage').value=data;let prev=document.getElementById('invPhotoPreview');prev.style.display='block';prev.innerHTML='<img src="'+data+'" alt="Produktfoto">'};img.src=reader.result};reader.readAsDataURL(file);
}
function saveProduct(id){
 let name=document.getElementById('invName').value.trim(), price=Number(document.getElementById('invPrice').value), stockRaw=document.getElementById('invStock').value, category=document.getElementById('invCat').value.trim()||'Sonstiges', image=document.getElementById('invImage').value.trim(), minStock=Math.max(0,Number(document.getElementById('invMin').value)||0), packageQtyRaw=document.getElementById('invPackageQty').value, packagePriceRaw=document.getElementById('invPackagePrice').value;
 let packageQty=packageQtyRaw===''?null:Math.max(2,Math.floor(Number(packageQtyRaw)||2)), packagePrice=packagePriceRaw===''?null:Number(packagePriceRaw);
 if((packageQtyRaw===''&&packagePriceRaw!=='')||(packageQtyRaw!==''&&packagePriceRaw==='')|| (packagePrice!==null&&(!Number.isFinite(packagePrice)||packagePrice<0)))return alert('Für einen Paketpreis bitte Anzahl und Paketpreis vollständig eingeben.');
 if(!name||!Number.isFinite(price)||price<0)return alert('Bitte Produktname und gültigen Preis eingeben.');
 let stock=stockRaw===''?null:Math.max(0,Math.floor(Number(stockRaw)||0));
 if(id){let p=products.find(x=>Number(x.id)===Number(id));if(!p)return alert('Produkt nicht gefunden.');Object.assign(p,{name,price,stock,category,image,minStock,packageQty,packagePrice})}else{products.push({id:Math.max(0,...products.map(p=>p.id))+1,name,price,stock,category,image,minStock,packageQty,packagePrice})}
 if(!categories.includes(category))categories.push(category);syncCategories();localStorage.setItem('ma_mobile_products',JSON.stringify(products));renderInventory();render();
}
function addCategory(){let el=document.getElementById('newCat'),name=(el?.value||'').trim();if(!name)return;if(categories.some(c=>c.toLowerCase()===name.toLowerCase()))return alert('Diese Kategorie gibt es bereits.');categories.push(name);syncCategories();renderInventory()}
function deleteCategory(encoded){let name=decodeURIComponent(encoded);if(products.some(p=>p.category===name)){if(!confirm('Kategorie „'+name+'“ enthält Artikel. Diese Artikel werden in „Sonstiges“ verschoben. Fortfahren?'))return;products.forEach(p=>{if(p.category===name)p.category='Sonstiges'});if(!categories.includes('Sonstiges'))categories.push('Sonstiges');localStorage.setItem('ma_mobile_products',JSON.stringify(products))}else if(!confirm('Kategorie „'+name+'“ wirklich löschen?'))return;categories=categories.filter(c=>c!==name);if(cat===name)cat='Alle';syncCategories();renderInventory();render()}
function stockChange(id,amount){let p=products.find(x=>x.id===id);if(!p||p.stock===null)return;p.stock=Math.max(0,p.stock+amount);localStorage.setItem('ma_mobile_products',JSON.stringify(products));renderInventory();render()}
function deleteProduct(id){
 let p=products.find(x=>Number(x.id)===Number(id));
 if(!p)return alert('Produkt nicht gefunden.');
 if(!confirm('Artikel „'+p.name+'“ wirklich dauerhaft löschen?\n\nAlte Verkäufe und Belege bleiben erhalten.'))return;
 products=products.filter(x=>Number(x.id)!==Number(id));
 delete cart[id];
 localStorage.setItem('ma_mobile_products',JSON.stringify(products));
 renderInventory();render();
}


function exportBackup(){
 const backup={app:'Michels Aquaristik Kasse',version:1,createdAt:new Date().toISOString(),products:products,categories:categories,sales:JSON.parse(localStorage.getItem('ma_mobile_sales')||'[]'),receiptNo:Number(localStorage.getItem('ma_mobile_receipt')||0)};
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a'),d=new Date(),date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 a.href=URL.createObjectURL(blob);a.download='Michels_Aquaristik_Kasse_Backup_'+date+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBackup(input){
 const file=input.files&&input.files[0];if(!file)return;
 const reader=new FileReader();reader.onload=()=>{try{const b=JSON.parse(reader.result);if(!b||!Array.isArray(b.products)||!Array.isArray(b.sales)||!Array.isArray(b.categories))throw new Error();if(!confirm('Backup vom '+(b.createdAt?new Date(b.createdAt).toLocaleString('de-CH'):'unbekannten Datum')+' wiederherstellen?\n\nDie aktuell gespeicherten Kassendaten werden dadurch ersetzt.')){input.value='';return}products=b.products;categories=b.categories;localStorage.setItem('ma_mobile_products',JSON.stringify(products));localStorage.setItem('ma_mobile_categories',JSON.stringify(categories));localStorage.setItem('ma_mobile_sales',JSON.stringify(b.sales));localStorage.setItem('ma_mobile_receipt',String(Number(b.receiptNo)||0));cart={};lastReceipt='';syncCategories();renderInventory();render();alert('Backup erfolgreich wiederhergestellt.')}catch(e){alert('Diese Datei ist kein gültiges Michels-Aquaristik-Kassen-Backup.')}input.value=''};reader.readAsText(file);
}

function xmlEsc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function printerConfig(){return {ip:localStorage.getItem('ma_epson_ip')||'192.168.118.57',protocol:localStorage.getItem('ma_epson_protocol')||'https'}}
function printerSettings(){let c=printerConfig(),ip=prompt('IP-Adresse des Epson TM-m30III:',c.ip);if(ip===null)return;ip=ip.trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip))return alert('Bitte eine gültige IP-Adresse eingeben.');let https=confirm('HTTPS verwenden?\n\nOK = HTTPS (empfohlen für Netlify)\nAbbrechen = HTTP');localStorage.setItem('ma_epson_ip',ip);localStorage.setItem('ma_epson_protocol',https?'https':'http');alert('Epson gespeichert: '+(https?'https':'http')+'://'+ip+'\n\nDrucker-ID: local_printer')}
async function epsonPrint(text){let c=printerConfig();let url=c.protocol+'://'+c.ip+'/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';let doc='<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><text>'+xmlEsc(text+'\n')+'</text><feed line="2"/><cut type="feed"/></epos-print>';let payload='<?xml version="1.0" encoding="utf-8"?>'+'<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body><epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print"><text>'+xmlEsc(text+'\n')+'</text><feed line="2"/><cut type="feed"/></epos-print></s:Body></s:Envelope>';let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{let r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/xml; charset=utf-8','If-Modified-Since':'Thu, 01 Jan 1970 00:00:00 GMT'},body:payload,signal:controller.signal,cache:'no-store'});let t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status);if(/success="false"/i.test(t)){let code=(t.match(/code="([^"]*)"/i)||[])[1]||'unbekannt';let status=(t.match(/status="([^"]*)"/i)||[])[1]||'';throw new Error('Epson-Ablehnung – Code: '+code+(status?' | Status: '+status:'')+'\n\nAntwort: '+t.slice(0,700));}return true}finally{clearTimeout(timer)}}
async function printReceipt(){if(!lastReceipt)return;printBtn.disabled=true;let old=printBtn.textContent;printBtn.textContent='⏳ Drucke direkt…';try{await epsonPrint(lastReceipt);alert('✅ Quittung wurde an den Epson TM-m30III gesendet.')}catch(e){let c=printerConfig();let reason=(e&&e.name==='AbortError')?'Zeitüberschreitung – Drucker nicht erreichbar.':(e&&e.message?e.message:'Verbindung fehlgeschlagen.');alert('❌ Direkter Epson-Druck noch nicht möglich.\n\n'+reason+'\n\nAdresse: '+c.protocol+'://'+c.ip+'\n\nPrüfe, ob iPhone und Drucker im selben WLAN sind und ePOS-Print im Epson WebConfig aktiviert ist. Bei HTTPS muss das Epson-Zertifikat auf dem iPhone akzeptiert sein.')}finally{printBtn.disabled=false;printBtn.textContent=old}}

function resetDemo(){if(!confirm('Testdaten, Verkäufe und Belegnummer wirklich zurücksetzen?'))return;localStorage.removeItem('ma_mobile_products');localStorage.removeItem('ma_mobile_receipt');localStorage.removeItem('ma_mobile_sales');localStorage.removeItem('ma_mobile_categories');products=JSON.parse(JSON.stringify(initial));categories=[];syncCategories();cart={};lastReceipt='';receiptEl.innerHTML='';printBtn.style.display='none';render();closeCart()}
render();
